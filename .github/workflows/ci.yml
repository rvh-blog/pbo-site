name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run changelog:validate
      - run: npm run assets:check
      - run: npx tsc --noEmit
      - run: npm run weekly:check
      - name: Lint changed files
        run: npm run lint:changed
        env:
          GITHUB_BASE_REF: ${{ github.base_ref }}
      - run: npm run build
