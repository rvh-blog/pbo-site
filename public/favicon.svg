<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Pokeball favicon matching header icon -->
  <!-- Red background with rounded corners -->
  <rect x="2" y="2" width="28" height="28" rx="6" fill="#e94560"/>
  <!-- Inner pokeball -->
  <circle cx="16" cy="16" r="10" fill="#e94560" stroke="white" stroke-width="2"/>
  <!-- Bottom half white -->
  <path d="M6 16 A10 10 0 0 0 26 16" fill="white" stroke="white" stroke-width="2"/>
  <!-- Center line -->
  <line x1="6" y1="16" x2="26" y2="16" stroke="white" stroke-width="2"/>
  <!-- Center button -->
  <circle cx="16" cy="16" r="3" fill="white" stroke="#e94560" stroke-width="2"/>
</svg>
